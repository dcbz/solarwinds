# solar.conf — DOSBox Staging configuration for the Solar Winds (Epic/STONE
# Interactive, 1993) runtime-capture harness (lane 8).
#
# Target: SOLAR1.EXE, sha256 7e7484a4a5eee9c2a9243820e551db27ca57567abb640c12d379c95c9b7983df
# Verified against DOSBox Staging 0.83.0 (/Applications/DOSBox Staging.app).
#
# This file is *intentionally* free of machine-specific absolute paths: run.sh
# starts DOSBox with --working-dir re/dosbox so that `capture_dir = captures`
# resolves to re/dosbox/captures regardless of where the repo lives.
#
# EVERY setting below is listed with its reason. Anything not mentioned here is
# left at the 0.83.0 default. Section 1 explains the two settings the task brief
# asked for by their 2010-era DOSBox names, which 0.83.0 no longer uses.
#
# ---------------------------------------------------------------------------
# Naming deltas vs. the task brief (and vs. vanilla DOSBox):
#   brief says            0.83.0 actual                note
#   -------------------   --------------------------   -----------------------------
#   captures=DIR          [capture] capture_dir        'captures' was moved+renamed;
#                                                      Staging logs "Moved to
#                                                      [capture] section and renamed
#                                                      to 'capture_dir'"
#   [cpu] cycles=auto     [cpu] cpu_cycles=<number>    'cycles' is deprecated-but-
#                                                      accepted; 'auto' is not a
#                                                      documented cpu_cycles value
#   [mixer] record        no DOS command exists        0.83.0's MIXER has no RECORD
#                                                      subcommand (verified: `strings`
#                                                      of the binary, mixer help text).
#                                                      Audio capture is the mapper
#                                                      action `recwave` (Cmd+F6 by
#                                                      default) — see solar.map
#   autolock              [mouse] mouse_capture        moved+renamed
# ---------------------------------------------------------------------------

[sdl]

# Windowed, never fullscreen: a human must be able to watch the replay, and the
# automated screenshots are taken while the window is unfocused.
fullscreen = off

# 3x integer scale of the 320x200 DOS framebuffer, so the host window is a
# literal magnification of it (960x600 = 3*320 x 3*200). This is the "320x200
# output" requirement expressed honestly: DOSBox cannot put a 320x200 window on
# screen under macOS without the compositor resampling it, and the capture artefacts
# are 320x200 regardless of this setting (see [capture] below).
window_size = 960x600

# Do not pause or mute when the DOSBox window loses focus. Both default to off, but
# they are pinned here explicitly: a backgrounded-but-still-emulating DOSBox is the
# precondition for unattended timed captures.
pause_when_inactive = off
mute_when_inactive = off

# Replayable input mapping: F11 -> screenshot, F12 -> start/stop audio recording.
# Loaded from this file so a run does not silently inherit the user's personal
# ~/Library/Preferences/DOSBox/mapper-sdl2-0.83.0.map (which would change what the
# scripted keys do). See solar.map.
mapperfile = solar.map

# Keep system shortcuts (Cmd+Tab etc.) on the host: the game's own keys are plain
# ASCII/arrows and never need them.
keyboard_capture = off

[dosbox]

# Quiet startup: no welcome banner / early stdout, so host stderr contains only
# real log lines. Task brief asked for "quiet startup".
startup_verbosity = quiet

# Default svga_s3 (S3 Trio64, VESA 2.0). Kept explicit rather than implicit: the
# engine's VGA writes need mode 13h + a 256-colour DAC, and lanes 3/1 must know
# which SVGA emulation the framebuffer dump came from.
machine = svga_s3

# 16 MB is the default and is plenty for a 1993 real-mode engine with overlays;
# pinned because memsize changes the DOS memory map and therefore every segment
# arithmetic a lane might cite from a replay.
memsize = 16

[cpu]

# The brief asked for cycles=auto. 0.83.0's real property is `cpu_cycles` and it
# takes a number or 'max' -- there is no documented 'auto'. Fixed 3000 cycles/ms
# (a 386DX-40-ish machine, the default) is the *reproducible* choice: 'max' makes
# frame pacing a function of host load, which would make every timing-sensitive
# capture (lane 5's pacing constant, lane 4's music length) irreproducible.
# Raising this only speeds up animation; Solar Winds paces itself off the INT 1Ah
# tick, not the CPU.
cpu_cycles = 3000

# 'auto' here means "follow cpu_cycles" (documented value for this property), so
# real and protected mode run at the same pinned speed.
cpu_cycles_protected = auto

# The engine is a real-mode MZ executable that overlays and self-modifies its own
# buffers; the 'normal' core gives the most accurate timings and is what the
# emulator's own HTTP-API docs recommend. Do NOT use 'dynamic' for captures.
core = normal

[render]

# Square pixels. Solar Winds draws 640x200-wide RLE images into a 2:1 horizontally
# mapped 320x200 frame (Evidence 0x24ff4 sets the INT 33h mouse range to 0..638 x
# 0..200). On a real CRT the picture *was* 4:3-appearing; correction is deliberately
# disabled here so that one captured pixel maps 1:1 to one framebuffer byte, which is
# what the picture-format lanes need. Set `aspect = auto` for human-eyeball shots.
# (Note: this belongs in [render], not [sdl]; putting it in [sdl] makes DOSBox log
# "No config section or setting exists with the name 'aspect'" and silently ignore it.)
aspect = off

# No CRT shader. With 'shader = none' the raw/rendered/upscaled capture formats all
# describe the same unmodified framebuffer, so a lane can cite any of them without a
# footnote about post-processing.
# (Also [render]-only; the 0.83.0 default is the adaptive 'crt-auto' shader.)
shader = none

[capture]

# Relative to the DOSBox working dir, which run.sh pins to re/dosbox with
# --working-dir, so artefacts land in re/dosbox/captures/.
capture_dir = captures

# 'raw' is the one that matters for RE: a 320x200 PNG that is a pixel-exact dump of
# the emulated framebuffer (no shader, no upscale, no aspect correction) -- directly
# comparable with lane 1's RLE decoder output. 'upscaled' is kept for humans.
default_image_capture_formats = raw upscaled

[mixer]

# Sound enabled; audio capture is via the `recwave` mapper action (solar.map, F12),
# not a MIXER subcommand -- 0.83.0's MIXER has no RECORD.
nosound = off

# 44100 Hz rather than the 48000 default: the recorded WAV then matches the sample
# rate the game's own SB DSP programming is likely to request, so the capture is a
# near-raw transcript of the DMA stream rather than a resampled one (lane 4).
rate = 44100

# Larger callback than the 512-frame default -> fewer, longer DMA handshakes per
# second, which makes SB recording glitches visible as discrete dropouts instead of
# smear. Still well within real-time on any 2020s host.
blocksize = 1024

# Disable the master compressor so the WAV's amplitude is the emulator's mixer
# output, not an auto-graded version of it (matters if a lane ever compares levels).
compressor = off

[sblaster]

# Sound Blaster 16 at 220/7/1/5 -- DOSBox's default and the 1993 status quo. Pinned
# explicitly because `/NOSB` (parsed at 0x23857) and the game's own SB autodetect
# both read this environment; a lane needs to know exactly which card was emulated.
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

# OPL3 on 220h+388h (default, emulated SB16 OPL). Needed to hear what BH_MS/BH_MU*
# playback actually sounds like (lane 4).
oplmode = auto

[serial]

# Nothing on the serial ports; a BBS door would read COM1/COM2, and leaving this at
# the default (none) is itself the controlled experiment for "does it need a door".
# Deliberately NOT configured -- see README-dosbox.md "door parameters".

[dos]

# DOS 5.0 (default). 1993 shareware is happy with 3.3+; a version-dependent branch
# would show up as a refusal to start, so the value must be citable.
ver = 5.0

# Real-mode game: leave XMS/EMS/UMB defaults alone, but state them, because the
# 17,831-byte state blob + overlay loads could plausibly use EMS and a lane should
# not have to guess.
xms = on
ems = on

[autoexec]
# Intentionally empty. All mounting and launching happens in run.sh via -c so that
# the same conf can be used for interactive exploration and scripted replay.
